;香港
custom_proxy_group=🇭🇰 香港自动`url-test`(香港|Hong Kong|Hongkong|HONG KONG|HK[-_ ]|🇭🇰)`http://www.gstatic.com/generate_204`300,,150

;台湾
custom_proxy_group=🇹🇼 台湾自动`url-test`(台湾|Taiwan|TAIWAN|TW[-_ ]|🇹🇼)`http://www.gstatic.com/generate_204`300,,150

;美国
custom_proxy_group=🇺🇲 美国自动`url-test`(美国|United States|UnitedStates|USA|US[-_ ]|America|AMERICA|🇺🇸)`http://www.gstatic.com/generate_204`300,,250

;日本
custom_proxy_group=🇯🇵 日本自动`url-test`(日本|Japan|JAPAN|JP[-_ ]|Tokyo|TOKYO|东京|大阪|🇯🇵)`http://www.gstatic.com/generate_204`300,,150

;韩国
custom_proxy_group=🇰🇷 韩国自动`url-test`(韩国|Korea|KOREA|South Korea|SouthKorea|KOR|KR[-_ ]|首尔|Seoul|🇰🇷)`http://www.gstatic.com/generate_204`300,,150


;==================================================;
; 其他国家
;==================================================;
;
; 精确排除：
; 新加坡
; 香港
; 台湾
; 美国
; 日本
; 韩国
;
; 法国、英国不再排除
; 因此法国、英国以及德国、荷兰、加拿大等
; 都会进入「🌍 其他国家」
;
;==================================================;

custom_proxy_group=🌍 其他国家`url-test`^(?!(.*(新加坡|狮城|Singapore|SINGAPORE|SG[-_ ]|🇸🇬|香港|Hong Kong|Hongkong|HONG KONG|HK[-_ ]|🇭🇰|台湾|Taiwan|TAIWAN|TW[-_ ]|🇹🇼|美国|United States|UnitedStates|USA|US[-_ ]|America|AMERICA|🇺🇸|日本|Japan|JAPAN|JP[-_ ]|Tokyo|TOKYO|东京|大阪|🇯🇵|韩国|Korea|KOREA|South Korea|SouthKorea|KOR|KR[-_ ]|首尔|Seoul|🇰🇷))).*$`http://www.gstatic.com/generate_204`300,,200


