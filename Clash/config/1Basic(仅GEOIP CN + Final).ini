[custom]

;==================================================
; 基础规则
;==================================================

; 强制直连
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/force-direct.list

; 强制代理
ruleset=Proxies,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/force-proxy.list

; 中国大陆域名直连
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/acl/cn-domains.txt

; GFWList 代理
ruleset=Proxies,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/acl/gfwlist.txt

; 中国 IP 直连
ruleset=DIRECT,[]GEOIP,CN

; 其他全部走代理
ruleset=Proxies,[]MATCH


;==================================================
; 节点总选择
;==================================================

custom_proxy_group=Proxies`select`[]♻️ 自动选择`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇺🇲 美国`[]🇬🇧 英国`[]🇫🇷 法国`.*


;==================================================
; 自动测速
;==================================================

; 全部节点自动测速
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,200

; 新加坡
custom_proxy_group=🇸🇬 新加坡`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,150

; 香港
custom_proxy_group=🇭🇰 香港`url-test`(香港|HK|Hong Kong|Hongkong)`http://www.gstatic.com/generate_204`300,,150

; 台湾
custom_proxy_group=🇹🇼 台湾`url-test`(台|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,150

; 日本
custom_proxy_group=🇯🇵 日本`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|Tokyo)`http://www.gstatic.com/generate_204`300,,150

; 美国
custom_proxy_group=🇺🇲 美国`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|America|California)`http://www.gstatic.com/generate_204`300,,250

; 英国
custom_proxy_group=🇬🇧 英国`url-test`(英国|GB|英格兰|England)`http://www.gstatic.com/generate_204`300,,150

; 法国
custom_proxy_group=🇫🇷 法国`url-test`(法国|FR|法兰西|巴黎|Paris)`http://www.gstatic.com/generate_204`300,,150


;==================================================
; 生成器设置
;==================================================

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/GeneralClashConfig.yml