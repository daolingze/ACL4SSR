[custom]
; Clash 可用 Subconverter INI 配置（国家分组强制显示）

; ========== 规则 ==========
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/force-direct.list
ruleset=Proxies,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/force-proxy.list
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/acl/cn-domains.txt
ruleset=Proxies,https://cdn.jsdelivr.net/gh/SleepyHeeead/subconverter-config@master/ruleset/acl/gfwlist.txt
ruleset=DIRECT,[]GEOIP,CN
ruleset=Proxies,[]MATCH

; ========== 策略组 ==========
; 主选择组
custom_proxy_group=Proxies`select`[]♻️ 自动选择`[]🚀 手动切换`[]DIRECT`[]🇸🇬 狮城`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇫🇷 法国`[]🇬🇧 英国`[]🇺🇲 美国`[]🇯🇵 日本

; 手动切换（全部节点）
custom_proxy_group=🚀 手动切换`select`.*

; 全局自动测速
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,200

; 国家分组（改为 select，强制显示）
custom_proxy_group=🇸🇬 狮城`select`(新加坡|坡|狮城|SG|Singapore)
custom_proxy_group=🇭🇰 香港`select`(香港|HK|Hong Kong|Hongkong)
custom_proxy_group=🇹🇼 台湾`select`(台|新北|彰化|TW|Taiwan)
custom_proxy_group=🇫🇷 法国`select`(法国|FR|法兰西|巴黎|Paris)
custom_proxy_group=🇬🇧 英国`select`(英国|GB|英格兰|England)
custom_proxy_group=🇺🇲 美国`select`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|America|California)
custom_proxy_group=🇯🇵 日本`select`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|Tokyo)

; ========== 生成选项 ==========
enable_rule_generator=true
overwrite_original_rules=true